<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark" data-theme-choice="dark" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>Signal Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect x='1' y='1' width='20' height='20' rx='4' fill='%2307080b' stroke='%233d8bfd'/%3E%3Cpath d='M6 14.5 9.2 8l2.2 4.2L14 7.5 16.5 14.5' fill='none' stroke='%233d8bfd' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/boot.js"></script>
</head>
<body>
<div id="app"></div>
<script src="js/i18n.js"></script>
<script src="js/chrome.js"></script>
<script>
(function () {
  var t = function (k) { return window.SRX.t(k); };
  var esc = function (s) { return window.SRX.esc(s); };
  function render() {
    window.SRX.applyDocument();
    var m = window.SRX.mktState();
    var px = m.price;
    var head = "";
    if (m.phase === "wait") head += '<p class="muted">' + esc(t("ex.waiting")) + "</p>";
    if (px) head += '<p class="price-line ltr"><span class="num">' + esc(String(px)) + "</span> " + esc(t("ex.live")) + "</p>";
    else if (m.phase === "done") head += '<p>' + esc(t("ex.pending")) + "</p>";
    var empty = m.phase === "done" && (!m.candles || !m.candles.length) ? '<p class="muted">' + esc(t("ex.emptyChart")) + "</p>" : "";
    document.getElementById("app").innerHTML = window.SRX.headerHTML({ href: "index.html" })
      + '<div class="page-body"><div id="main" tabindex="-1" class="view"><h1>' + esc(t("admin.title")) + "</h1><p>" + esc(t("admin.lead")) + "</p>"
      + '<section class="panel explorer"><div class="ex-top"><h2>' + esc(t("ex.pair")) + '</h2><span class="tf-label ltr">' + esc(t("ex.range")) + "</span></div>"
      + head
      + '<div class="chart-wrap"><canvas id="chart"></canvas></div>'
      + empty
      + '<div class="source"><h2>' + esc(t("api.sourceTitle")) + "</h2><p>" + esc(t("ex.sourceName")) + "</p><p>" + esc(t("api.explain")) + "</p>"
      + '<p class="ltr">' + esc(t("api.ticker")) + "</p>"
      + '<p class="ltr">' + esc(t("api.kline")) + "</p>"
      + "<p>" + esc(t("api.limit")) + "</p><p>" + esc(t("api.weights")) + "</p>"
      + window.SRX.errBlock(m.tickerStatus, m.tickerErr)
      + window.SRX.errBlock(m.klineStatus, m.klineErr)
      + '<button type="button" class="solid" id="refresh">' + esc(t("ex.refresh")) + "</button></div></section></div></div>";
    window.SRX.drawCloses(document.getElementById("chart"), m.candles || []);
    if (m.phase === "idle") window.SRX.loadBtc(false).then(render);
  }
  document.addEventListener("click", function (e) {
    if (e.target.closest("#refresh")) {
      window.SRX.loadBtc(true).then(render);
      render();
    }
  });
  window.SRX.initChrome();
  window.SR.onChange = render;
  render();
})();
</script>
</body>
</html>
