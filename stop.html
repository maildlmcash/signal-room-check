<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark" data-theme-choice="dark" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>Signal Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect x='1' y='1' width='20' height='20' rx='4' fill='%2307080b' stroke='%233d8bfd'/%3E%3Cpath d='M6 14.5 9.2 8l2.2 4.2L14 7.5 16.5 14.5' fill='none' stroke='%233d8bfd' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/boot.js"></script>
</head>
<body>
<div id="app"></div>
<script src="js/i18n.js"></script>
<script src="js/chrome.js"></script>
<script>
(function () {
  var t = function (k) { return window.SRX.t(k); };
  var esc = function (s) { return window.SRX.esc(s); };
  window.SR.stopNoted = window.SR.stopNoted || false;
  function render() {
    window.SRX.applyDocument();
    document.getElementById("app").innerHTML = window.SRX.headerHTML({ href: "index.html" })
      + '<div class="page-body"><div id="main" tabindex="-1" class="view"><h1>' + esc(t("stop.title")) + "</h1><p>" + esc(t("stop.lead")) + "</p>"
      + '<div class="stop-wrap"><button type="button" class="switch" id="arm" role="switch" aria-checked="false"><span class="knob"></span></button><span class="stop-off">' + esc(t("stop.off")) + "</span></div>"
      + '<p id="stop-note">' + esc(window.SR.stopNoted ? t("stop.stays") : "") + "</p></div></div>";
  }
  document.addEventListener("click", function (e) {
    var arm = e.target.closest("#arm");
    if (!arm) return;
    e.preventDefault();
    window.SR.stopNoted = true;
    arm.setAttribute("aria-checked", "false");
    var note = document.getElementById("stop-note");
    if (note) note.textContent = t("stop.stays");
  });
  window.SRX.initChrome();
  window.SR.onChange = render;
  render();
})();
</script>
</body>
</html>
